<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobFinder Login</title>
<style>
body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:100%;max-width:440px;background:white;padding:32px;border-radius:18px;box-shadow:0 12px 35px #0001}.brand{text-align:center;font-size:28px;font-weight:800;color:#2457d6}.sub{text-align:center;color:#667085;margin:8px 0 25px}.tabs{display:flex;background:#f1f4f9;padding:4px;border-radius:10px;margin-bottom:20px}.tabs button{flex:1;border:0;padding:11px;border-radius:8px;background:none;font-weight:bold}.tabs .on{background:white;color:#2457d6;box-shadow:0 2px 8px #0001}form{display:none}form.on{display:block}label{display:block;font-weight:bold;font-size:14px;margin:14px 0 7px}input,select{width:100%;padding:12px;border:1px solid #d6dbe5;border-radius:9px;box-sizing:border-box}.btn{width:100%;padding:13px;margin-top:20px;border:0;border-radius:9px;background:#2457d6;color:white;font-weight:bold}.msg{display:none;padding:10px;border-radius:8px;margin-bottom:12px;font-size:14px}.err{background:#fff0f0;color:#b42318}.ok{background:#ecfdf3;color:#067647}.demo{margin-top:20px;background:#f7f9fc;padding:12px;border-radius:9px;font-size:13px;color:#667085}
</style></head><body><div class="wrap"><div class="box">
<div class="brand">JobFinder</div><div class="sub">Find your next work-from-home opportunity</div>
<div class="tabs"><button id="lt" class="on" onclick="tab('login')">Login</button><button id="rt" onclick="tab('reg')">Register</button></div>
<div id="lm" class="msg"></div><form id="login" class="on">
<label>Email Address</label><input id="email" type="email" required placeholder="Enter your email">
<label>Password</label><input id="pass" type="password" required placeholder="Enter your password">
<button class="btn">Login</button></form>
<div id="rm" class="msg"></div><form id="reg">
<label>Full Name</label><input id="name" required><label>Email Address</label><input id="re" type="email" required>
<label>Mobile Number</label><input id="mobile" required><label>Preferred Work Type</label><select id="work" required><option value="">Select</option><option>Work From Home</option><option>Hybrid</option><option>Office</option></select>
<label>Password</label><input id="rp" type="password" required><label>Confirm Password</label><input id="rc" type="password" required>
<button class="btn">Create Account</button></form>
<div class="demo"><b>Demo Login</b><br>Super Admin: admin@jobfinder.local / Admin@123<br>Job Seeker: user@jobfinder.local / User@123</div>
</div></div>
<script>
const A={email:'admin@jobfinder.local',password:'Admin@123',role:'super_admin',name:'Super Admin'};
const D={email:'user@jobfinder.local',password:'User@123',role:'user',name:'Demo User',workType:'Work From Home'};
function users(){return JSON.parse(localStorage.getItem('jfUsers')||'[]')}
function tab(x){let l=x==='login';document.getElementById('login').classList.toggle('on',l);document.getElementById('reg').classList.toggle('on',!l);document.getElementById('lt').classList.toggle('on',l);document.getElementById('rt').classList.toggle('on',!l)}
function msg(id,t,c){let e=document.getElementById(id);e.textContent=t;e.className='msg '+c;e.style.display='block'}
document.getElementById('login').onsubmit=e=>{e.preventDefault();let em=email.value.trim().toLowerCase(),pw=pass.value,u=null;if(em===A.email&&pw===A.password)u=A;else if(em===D.email&&pw===D.password)u=D;else u=users().find(x=>x.email.toLowerCase()===em&&x.password===pw);if(!u)return msg('lm','Invalid email or password.','err');localStorage.setItem('jfSession',JSON.stringify(u));window.location.href='home.html'};
document.getElementById('reg').onsubmit=e=>{e.preventDefault();let u={name:name.value.trim(),email:re.value.trim().toLowerCase(),mobile:mobile.value.trim(),workType:work.value,password:rp.value,role:'user'};if(u.password.length<6)return msg('rm','Password must be at least 6 characters.','err');if(u.password!==rc.value)return msg('rm','Passwords do not match.','err');if(users().some(x=>x.email===u.email)||u.email===A.email||u.email===D.email)return msg('rm','An account with this email already exists.','err');let a=users();a.push(u);localStorage.setItem('jfUsers',JSON.stringify(a));email.value=u.email;msg('rm','Registration successful. Please login.','ok');setTimeout(()=>tab('login'),900)};
</script></body></html>
