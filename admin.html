<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobFinder Admin</title>
<style>body{font-family:Arial;background:#f5f7fb;margin:0;padding:40px}.box{max-width:900px;margin:auto;background:#fff;padding:30px;border-radius:16px}button{padding:10px 15px;border:0;border-radius:8px;background:#2457d6;color:#fff;font-weight:bold}a{color:#2457d6}</style>
</head><body><div class="box"><h1>Super Admin Panel</h1><p id="who"></p><p><a href="home.html">← Back to Home</a></p><button onclick="logout()">Logout</button></div>
<script>
const s=JSON.parse(localStorage.getItem('jfSession')||'null');
if(!s||s.role!=='super_admin') location.href='login.html';
else document.getElementById('who').textContent='Logged in as '+(s.name||'Super Admin')+' • '+s.email;
function logout(){localStorage.removeItem('jfSession');location.href='login.html'}
</script></body></html>
