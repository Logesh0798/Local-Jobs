<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobFinder — My Applications</title>
<style>body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}header{height:68px;background:#fff;border-bottom:1px solid #e6e9ef;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.logo{font-size:24px;font-weight:800;color:#2457d6}nav{display:flex;gap:18px;align-items:center}a{color:#2457d6;text-decoration:none;font-weight:bold}.logout{padding:9px 14px;border:1px solid #d6dbe5;background:white;border-radius:8px;font-weight:bold}.container{max-width:1000px;margin:auto;padding:35px 20px}.card{background:#fff;border:1px solid #e6e9ef;border-radius:14px;padding:24px}.empty{padding:35px;text-align:center;color:#667085}.row{border-top:1px solid #edf0f4;padding:16px 0}.pill{display:inline-block;background:#eef4ff;color:#2457d6;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}</style></head>
<body><header><div class="logo">JobFinder</div><nav><a href="home.html">Home</a><a href="user.html">My Applications</a><a id="admin" href="admin.html" style="display:none">Admin Panel</a><a class="logout" href="index.html?logout=1" onclick="return logout(event)">Logout</a></nav></header>
<main class="container"><div class="card"><h1>My Applications</h1><p id="who"></p><div id="apps" class="empty">No applications have been added yet.</div></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://hannumkwlfjpmajxzvjr.supabase.co', SUPABASE_KEY='sb_publishable_kam_0fSdNC8XEWbj-ZvVOQ_g8tYkRJJ';
const {createClient}=supabase, db=createClient(SUPABASE_URL,SUPABASE_KEY);
async function loadApplications(){
 const {data:{session}}=await db.auth.getSession(); if(!session){location.href='index.html';return;}
 const {data:{user}}=await db.auth.getUser();
 const {data:profile}=await db.from('profiles').select('*').eq('id',user.id).single();
 document.getElementById('who').textContent='Logged in as '+(profile?.full_name||'User')+' • '+user.email;
 if(profile?.role==='admin')document.getElementById('admin').style.display='inline';
 const {data,error}=await db.from('applications').select('id,status,applied_at,notes,jobs(title,company_name,location,work_type)').eq('user_id',user.id).order('applied_at',{ascending:false});
 const card=document.querySelector('.card');
 if(error){card.insertAdjacentHTML('beforeend','<div class="row">Unable to load applications.</div>');return;}
 if(!data.length){card.insertAdjacentHTML('beforeend','<div class="row empty">No applications yet.</div>');return;}
 data.forEach(a=>card.insertAdjacentHTML('beforeend','<div class="row"><b>'+escapeHtml(a.jobs?.title||'Job')+'</b><br>'+escapeHtml(a.jobs?.company_name||'')+'<br><span class="pill">'+escapeHtml(a.status)+'</span></div>'));
}
async function logout(event){
  if(event) event.preventDefault();
  const target='index.html?logout=1';
  try{
    if(typeof db!=='undefined' && db?.auth){
      await Promise.race([
        db.auth.signOut({scope:'local'}),
        new Promise(resolve=>setTimeout(resolve,1200))
      ]);
    }
  }catch(e){}
  try{Object.keys(localStorage).filter(k=>k.startsWith('sb-')).forEach(k=>localStorage.removeItem(k));}catch(e){}
  window.location.replace(target);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
loadApplications();
</script>
</body></html>
