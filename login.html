<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobFinder — Login</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:100%;max-width:440px;background:#fff;padding:32px;border-radius:18px;box-shadow:0 12px 35px #0001}.brand{text-align:center;font-size:28px;font-weight:800;color:#2457d6}.sub{text-align:center;color:#667085;margin:8px 0 25px}.tabs{display:flex;background:#f1f4f9;padding:4px;border-radius:10px;margin-bottom:20px}.tabs button{flex:1;border:0;padding:11px;border-radius:8px;background:none;font-weight:bold;cursor:pointer}.tabs .on{background:#fff;color:#2457d6;box-shadow:0 2px 8px #0001}form{display:none}form.on{display:block}label{display:block;font-weight:bold;font-size:14px;margin:14px 0 7px}input,select{width:100%;padding:12px;border:1px solid #d6dbe5;border-radius:9px;box-sizing:border-box}button.submit{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#2457d6;color:white;font-weight:bold;cursor:pointer}.msg{display:none;margin:12px 0;padding:11px;border-radius:9px;font-size:14px}.err{background:#fff0f0;color:#b42318}.ok{background:#ecfdf3;color:#027a48}.demo{margin-top:20px;padding:12px;background:#f8fafc;border-radius:10px;font-size:12px;color:#667085}.busy{opacity:.65;pointer-events:none}
</style>
</head>
<body>
<div class="wrap"><div class="box">
<div class="brand">JobFinder</div>
<div class="sub">Find your next work-from-home opportunity</div>
<div class="tabs"><button id="lt" class="on" type="button" onclick="tab('login')">Login</button><button id="rt" type="button" onclick="tab('reg')">Register</button></div>

<form id="login" class="on">
<label>Email Address</label><input id="email" type="email" required autocomplete="email">
<label>Password</label><input id="pass" type="password" required autocomplete="current-password">
<div id="lm" class="msg"></div><button class="submit" type="submit">Login</button>
</form>

<form id="reg">
<label>Full Name</label><input id="rname" required>
<label>Email Address</label><input id="re" type="email" required autocomplete="email">
<label>Mobile Number</label><input id="mobile" type="tel">
<label>Preferred Work Type</label><select id="work"><option>Work From Home</option><option>Remote</option><option>Hybrid</option><option>Office</option></select>
<label>Password</label><input id="rp" type="password" minlength="6" required autocomplete="new-password">
<label>Confirm Password</label><input id="rc" type="password" minlength="6" required autocomplete="new-password">
<div id="rm" class="msg"></div><button class="submit" type="submit">Create Account</button>
</form>

<div class="demo"><strong>Existing Super Admin:</strong> Use the real Supabase admin account you created. No demo/localStorage credentials are used in this version.</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://hannumkwlfjpmajxzvjr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kam_0fSdNC8XEWbj-ZvVOQ_g8tYkRJJ';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

function tab(x){const l=x==='login';document.getElementById('login').classList.toggle('on',l);document.getElementById('reg').classList.toggle('on',!l);document.getElementById('lt').classList.toggle('on',l);document.getElementById('rt').classList.toggle('on',!l)}
function msg(id,t,c){const e=document.getElementById(id);e.textContent=t;e.className='msg '+c;e.style.display='block'}
function clearMsg(id){const e=document.getElementById(id);e.style.display='none'}
function busy(form,on){form.classList.toggle('busy',on)}

(async()=>{
  const params=new URLSearchParams(location.search);
  if(params.get('logout')==='1'){
    try{await db.auth.signOut({scope:'local'});}catch(e){}
    try{Object.keys(localStorage).filter(k=>k.startsWith('sb-')).forEach(k=>localStorage.removeItem(k));}catch(e){}
    history.replaceState({},document.title,location.pathname);
    return;
  }
  const {data}=await db.auth.getSession();
  if(data.session) window.location.href='home.html';
})();

document.getElementById('login').onsubmit=async e=>{
 e.preventDefault(); clearMsg('lm'); const form=e.currentTarget; busy(form,true);
 const em=document.getElementById('email').value.trim().toLowerCase(), pw=document.getElementById('pass').value;
 const {error}=await db.auth.signInWithPassword({email:em,password:pw});
 busy(form,false);
 if(error){msg('lm',error.message==='Invalid login credentials'?'Invalid email or password.':error.message,'err');return;}
 window.location.href='home.html';
};

document.getElementById('reg').onsubmit=async e=>{
 e.preventDefault(); clearMsg('rm'); const form=e.currentTarget;
 const password=document.getElementById('rp').value, confirm=document.getElementById('rc').value;
 if(password.length<6)return msg('rm','Password must be at least 6 characters.','err');
 if(password!==confirm)return msg('rm','Passwords do not match.','err');
 busy(form,true);
 const {data,error}=await db.auth.signUp({
   email:document.getElementById('re').value.trim().toLowerCase(),
   password,
   options:{data:{
     full_name:document.getElementById('rname').value.trim(),
     mobile:document.getElementById('mobile').value.trim(),
     work_type:document.getElementById('work').value
   }}
 });
 busy(form,false);
 if(error){msg('rm',error.message,'err');return;}
 document.getElementById('email').value=document.getElementById('re').value.trim().toLowerCase();
 if(data.session){msg('rm','Registration successful. Redirecting...','ok');setTimeout(()=>window.location.href='home.html',500);}
 else {msg('rm','Registration successful. Please check your email to confirm your account.','ok');setTimeout(()=>tab('login'),1200);}
};
</script>
</body></html>
